site_name: Xiao Hei VLN
site_description: Team Xiao Hei's VLM stack for the CMU VLN Challenge 2026
repo_url: https://github.com/ginlov/xiao-hei-vln-cmu
repo_name: xiao-hei-vln-cmu

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Docker: getting-started/docker.md
      - Configuration: getting-started/configuration.md
  - Concepts:
      - Messages & I/O: concepts/messages.md
      - Responder Protocol: concepts/responder.md
      - Tick Loop: concepts/tick-loop.md
      - Exploration Phase: concepts/exploration.md
      - Frontier Explorer: concepts/frontier-explorer.md
      - Scene Representation: scene-representation.md
      - Perception (Sidecar + Responder): perception-sidecar.md
  - Guides:
      - New Model Integration: guides/new-model.md
      - New Exploration Strategy: guides/new-exploration-strategy.md
      - Evaluation: guides/evaluation.md
      - Online Perception + Scoring: guides/online-perception-eval.md
      - Data Generation: guides/data-generation.md
      - Dataset EDA: eda_report.md
      - VLM Logging & Replay: guides/vlm-logging.md
      - Coverage Trajectory: guides/trajectory.md
  - API Reference:
      - messages: api/messages.md
      - logger: api/logger.md
      - image_utils: api/image_utils.md
      - evaluator: api/evaluator.md
      - sync: api/sync.md
      - trajectory: api/trajectory.md
  - Task Reports:
      - Overview: tasks/index.md
      - Reports:
          - "1 — Consolidate I/O format": "tasks/TASK 1 - Consolidate input-output format for the VLM model.md"
          - "2 — End-to-end Docker integration": "tasks/TASK 2 - End-to-end integrate to docker container.md"
          - "3 — VLA-3D dataset pipeline": "tasks/TASK 3 - VLA-3D generated dataset pipeline.md"
          - "4 — Integrate Qwen3.5 VL": "tasks/TASK 4 - Integrate Qwen3.5 VL for testing.md"
          - "5 — VLM tick logger": "tasks/TASK 5 - VLM tick logger for debugging and visualization.md"
          - "6 — Documentation webpage": "tasks/TASK 6 - Documentation webpage.md"
          - "7 — Data coupling": "tasks/TASK 7 - Data coupling.md"
          - "7 — Data sample visualization": "tasks/TASK 7 - Data sample visualization script.md"
          - "7 — Evaluation pipeline integration": "tasks/TASK 7 - Evaluation pipeline integration.md"
          - "8 — Frontier-based room exploration": "tasks/TASK 8 - Frontier-based room exploration.md"
          - "8 — Ref dataset ambiguity audit": "tasks/TASK 8 - Ref dataset ambiguity audit and label-vocab fix.md"
          - "9 — Expand ref corpus": "tasks/TASK 9 - Expand ref corpus and match official phrasing distribution.md"
          - "9 — Gemini-backed responder": "tasks/TASK 9 - Gemini-backed responder for Task 1 and Task 2.md"
          - "10 — Offline Gemini evaluation": "tasks/TASK 10 - Offline Gemini evaluation pipeline for Task 1 and Task 2.md"
          - "10 — Scene representation": "tasks/TASK 10 - Scene representation.md"
          - "11 — Perception responder": "tasks/TASK 11 - Perception responder.md"
          - "12 — Consolidate exploration + scene-building": "tasks/TASK 12 - Consolidate exploration + scene-building pipeline.md"
          - "13 — Merge perception enhancements": "tasks/TASK 13 - Merge perception enhancements into the pipeline.md"
          - "14 — Consolidate submission pipeline": "tasks/TASK 14 - Consolidate submission pipeline into the scene_gemini responder.md"
          - "15 — Retire Phase-A exploration stack": "tasks/TASK 15 - Retire the unreachable Phase-A exploration stack.md"
          - "16 — Move task reports into docs/tasks": "tasks/TASK 16 - Move task reports into docs-tasks.md"
          - "17 — Retire the qwen responder": "tasks/TASK 17 - Retire the qwen responder.md"
          - "18 — Deduplicate the responder factory": "tasks/TASK 18 - Deduplicate the responder factory.md"
          - "19 — Remove the near-relation subsystem": "tasks/TASK 19 - Remove the near-relation subsystem.md"
