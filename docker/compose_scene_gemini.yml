# Xiao Hei VLN — submission stack (scene_gemini responder).
#
# One command brings up the full end-to-end pipeline:
#
#   frontier exploration  →  perception scene graph (YOLO-World + SAM)  →  Gemini answer
#
# Three containers:
#   - system      : challenge simulator (unmodified official image, GPU).
#   - perception  : YOLO-World v2 + SAM 2.1 sidecar (GPU) — builds the object graph.
#   - ai_module   : our node running XIAO_HEI_RESPONDER=scene_gemini (no GPU; Gemini
#                   reasoning runs in the cloud, perception runs in the sidecar).
#
# Usage:
#   export XIAO_HEI_GEMINI_API_KEY=<your-key>     # REQUIRED — validated at boot
#   export XIAO_HEI_VLM_LOG_DIR=/vlm_logs         # writes predictions.jsonl for scoring
#   xhost +local:
#   docker compose -f docker/compose_scene_gemini.yml up -d --build
#
#   # inside iros2026_system: start the sim
#   docker exec -it iros2026_system \
#     /home/docker/autonomy_stack_mecanum_wheel_platform/system_simulation.sh
#
#   # ask a question, then watch the answer topic + logs
#   docker exec iros2026_system bash -lc \
#     'source /opt/ros/jazzy/setup.bash && export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp && \
#      ros2 topic pub --once /challenge_question std_msgs/msg/String "{data: \"How many chairs are in the room\"}"'
#   docker logs -f xiao_hei_ai_module
#
# > The API key must be valid at startup: GeminiEngine.warmup() issues one live
# > call when ai_module boots; an invalid/missing key crash-loops the container.
#
# Exploration is authoritative here (single sweep): the app-level FrontierExplorer
# drives movement while the perception sidecar builds the scene graph via ingest();
# the answer is deferred until the sweep completes. Tune the sweep with
# XIAO_HEI_EXPLORATION_MAX_WAYPOINTS (0 disables exploration → answer from spawn).

# Pin the project name: Compose otherwise derives it from the parent dir
# ("docker"), which collides with every other checkout of this repo and with
# the challenge template — causing stacks to merge and clobber each other.
name: xiao-hei

services:
  # Challenge simulator (unmodified official image). Needs the GPU to render.
  system:
    image: zhangjicmu/ubuntu24_ros:cmu_vla_challenge_simulation
    container_name: iros2026_system
    privileged: true
    network_mode: host
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Perception sidecar — YOLOv8-World v2 + SAM 2.1 Hiera Tiny. Builds the object
  # scene graph the responder feeds to Gemini. Shares the GPU with the sim.
  perception:
    build:
      context: ../perception
      dockerfile: Dockerfile
    image: xiao-hei/perception:latest
    container_name: xiao_hei_perception
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - PERCEPTION_HOST=0.0.0.0
      - PERCEPTION_PORT=8001
      # Set PERCEPTION_DEBUG=1 on the host to dump per-/detect step images.
      - PERCEPTION_DEBUG=${PERCEPTION_DEBUG:-}
    volumes:
      - ../perception/server.py:/opt/perception/server.py:ro
      - ../perception/pipeline.py:/opt/perception/pipeline.py:ro
      - ../perception/geometry.py:/opt/perception/geometry.py:ro
      - ../perception/debug:/opt/perception/debug
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Our AI module — scene_gemini responder. No GPU: perception runs in the
  # sidecar and reasoning runs in the Gemini cloud. Installs the perception
  # HTTP client + the Gemini SDK + the exploration/plotting deps.
  ai_module:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        XIAO_HEI_EXTRA: ${XIAO_HEI_EXTRA:-perception,gemini,exploration}
    image: xiao-hei/ai_module:scene_gemini
    container_name: xiao_hei_ai_module
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - PYTHONUNBUFFERED=1
      - XIAO_HEI_RESPONDER=${XIAO_HEI_RESPONDER:-scene_gemini}
      - XIAO_HEI_VLM_TICK_HZ
      - XIAO_HEI_VLM_LOG_DIR=${XIAO_HEI_VLM_LOG_DIR:-/vlm_logs}
      - XIAO_HEI_EXPLORATION_LOG_DIR=${XIAO_HEI_EXPLORATION_LOG_DIR:-/exploration_logs}
      # A *host* path (compose.scene.yml bind-mounts it into the sim), so the
      # node reads it only to name its artefact dir. Without it every scene
      # writes to default_scene/.
      - XIAO_HEI_SCENE_DIR_HOST=${XIAO_HEI_SCENE_DIR_HOST:-}
      # Exploration sweep (authoritative). 0 disables → answer from spawn pose.
      - XIAO_HEI_EXPLORATION_MAX_WAYPOINTS=${XIAO_HEI_EXPLORATION_MAX_WAYPOINTS:-100}
      # Wall-clock cutoff for the sweep (8 min). 0 disables.
      - XIAO_HEI_EXPLORATION_MAX_SECONDS=${XIAO_HEI_EXPLORATION_MAX_SECONDS:-480}
      - XIAO_HEI_EXPLORATION_STRATEGY=${XIAO_HEI_EXPLORATION_STRATEGY:-frontier}
      # Max hop per proposed waypoint (m). nav_task1 uses a larger hop so
      # proposals spread out / reach newer vantages. Empty = code default (1.5).
      - XIAO_HEI_EXPLORATION_MAX_WAYPOINT_DIST=${XIAO_HEI_EXPLORATION_MAX_WAYPOINT_DIST:-}
      # Re-write both PNGs every N s, so a run torn down before DONE still
      # leaves images. 0 = end of sweep only.
      - XIAO_HEI_EXPLORATION_SNAPSHOT_S=${XIAO_HEI_EXPLORATION_SNAPSHOT_S:-30}
      # Perception sidecar (scene-graph building via ingest()).
      - XIAO_HEI_PERCEPTION_BASE_URL=${XIAO_HEI_PERCEPTION_BASE_URL:-http://localhost:8001}
      - XIAO_HEI_PERCEPTION_SCORE_THRESHOLD
      - XIAO_HEI_PERCEPTION_MIN_INLIERS
      # Gemini reasoning. The key is required; interpolated (not bare) so a
      # value in .env is picked up — `docker compose` only feeds .env into
      # ${...} substitutions, never into bare `- VAR` pass-throughs.
      - XIAO_HEI_GEMINI_API_KEY=${XIAO_HEI_GEMINI_API_KEY:?set XIAO_HEI_GEMINI_API_KEY in .env or export it}
      - XIAO_HEI_GEMINI_MODEL=${XIAO_HEI_GEMINI_MODEL:-gemini-2.5-flash}
      - XIAO_HEI_GEMINI_TEMPERATURE
      - XIAO_HEI_GEMINI_MAX_OUTPUT_TOKENS
      - XIAO_HEI_GEMINI_IMAGE_LONG_EDGE
      - XIAO_HEI_GEMINI_THINKING_BUDGET
      # Claude reasoning — used by XIAO_HEI_RESPONDER=scene_claude +
      # XIAO_HEI_EXPLORATION_STRATEGY=nav_task1 (question-directed navigation to
      # the referenced object, then Claude answers from the scene-graph dump).
      # Optional here (interpolated, not bare, so a .env value is picked up) so a
      # scene_gemini run needs no Claude key; the answerer requires it at boot
      # when scene_claude is selected.
      - XIAO_HEI_ANTHROPIC_API_KEY=${XIAO_HEI_ANTHROPIC_API_KEY:-}
      - XIAO_HEI_NAV_VLM_MODEL=${XIAO_HEI_NAV_VLM_MODEL:-}
      # nav_task1 TOTAL per-question budget (nav + answer), seconds; and the
      # reserve held back for the final answer so it lands inside the budget.
      # Empty = code defaults (600 total, 60 reserve → nav stops at 540s).
      - XIAO_HEI_NAV_TASK1_MAX_QUESTION_S=${XIAO_HEI_NAV_TASK1_MAX_QUESTION_S:-}
      - XIAO_HEI_NAV_TASK1_ANSWER_RESERVE_S=${XIAO_HEI_NAV_TASK1_ANSWER_RESERVE_S:-}
      # Paper ablations (empty = baseline). RAW_REASONING=1 drops the MCP
      # waypoint tool call (waypoint parsed from a fenced JSON block instead);
      # PERCEPTION_STEER=0 disables the navigator's in-loop perception control
      # (verify_objects + visible-object vocab priming).
      - XIAO_HEI_NAV_RAW_REASONING=${XIAO_HEI_NAV_RAW_REASONING:-}
      - XIAO_HEI_NAV_PERCEPTION_STEER=${XIAO_HEI_NAV_PERCEPTION_STEER:-}
      # Ablation A re-plan cadence (s); only used when RAW_REASONING=1.
      - XIAO_HEI_NAV_NAIVE_REPLAN_S=${XIAO_HEI_NAV_NAIVE_REPLAN_S:-}
    volumes:
      - ../src:/opt/xiao_hei_vln/src:ro
      - ../vlm_logs:/vlm_logs
      - ../exploration_logs:/exploration_logs
    stdin_open: true
    tty: true
    depends_on:
      - system
      - perception
    restart: unless-stopped
