# Aryan-only overlay: unique container names + ROS domain so we don't
# clobber a shared `xiao_hei_ai_module` / `iros2026_system` stack.
#
# Usage (from repo root):
#   export DISPLAY=:0
#   xhost +local:
#   docker compose -p aryan_nbv \
#     -f docker/compose_scene_gemini.yml \
#     -f docker/compose.scene.yml \
#     -f docker/compose.aryan.yml \
#     up -d --force-recreate

services:
  system:
    container_name: aryan_iros2026_system
    environment:
      - ROS_DOMAIN_ID=42
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      # Compose base sets XAUTHORITY=/tmp/.docker.xauth; mount it if present.
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw

  perception:
    container_name: aryan_xiao_hei_perception
    # Dockerfile CMD hardcodes --port 8001; override so we don't fight port 8001.
    command: ["python3", "-m", "uvicorn", "perception.server:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      - PERCEPTION_PORT=8002
      - ROS_DOMAIN_ID=42

  ai_module:
    container_name: aryan_xiao_hei_ai_module
    environment:
      - ROS_DOMAIN_ID=42
      - DISPLAY=${DISPLAY:-:0}
      - XIAO_HEI_PERCEPTION_BASE_URL=http://localhost:8002
      - XIAO_HEI_EXPLORATION_STRATEGY=${XIAO_HEI_EXPLORATION_STRATEGY:-frontier}
      - XIAO_HEI_EXPLORATION_MAX_WAYPOINT_DIST=${XIAO_HEI_EXPLORATION_MAX_WAYPOINT_DIST:-3.0}
      - XIAO_HEI_EXPLORATION_MAX_WAYPOINTS=${XIAO_HEI_EXPLORATION_MAX_WAYPOINTS:-100}
      - XIAO_HEI_EXPLORATION_MAX_SECONDS=${XIAO_HEI_EXPLORATION_MAX_SECONDS:-540}
      - XIAO_HEI_OBJECT_MAP=${XIAO_HEI_OBJECT_MAP:-1}
      - XIAO_HEI_VIEWPOINT_RADIUS=${XIAO_HEI_VIEWPOINT_RADIUS:-0.8}
      - XIAO_HEI_SCENE_DUMP_PATH=${XIAO_HEI_SCENE_DUMP_PATH:-}
      - XIAO_HEI_SCENE_DIR_HOST=${XIAO_HEI_SCENE_DIR_HOST}
