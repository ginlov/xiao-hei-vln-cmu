# Scene-mount overlay for the simulator container.
#
# Layered automatically by docker/run when XIAO_HEI_SCENE_DIR_HOST is set.
# Bind-mounts the host's extracted-scene `environment/` directory over the
# sim image's prebaked one, so a single env var picks which scene Unity
# loads in `system` (e.g. arabic_room for the perception responder).
#
# Expected layout under XIAO_HEI_SCENE_DIR_HOST (matches what unzip
# produces from any unity_env_models/<scene>.zip):
#
#   <scene_dir>/
#     environment/
#       Model.x86_64
#       Model_Data/
#       UnityPlayer.so
#       …
#     map.ply, object_list.txt, traversable_area.ply, …
#
# Only `environment/` is mounted — that's what system_simulation.sh
# launches. The sibling files (map.ply, object_list.txt, etc.) are not
# used by the sim.

services:
  system:
    volumes:
      - ${XIAO_HEI_SCENE_DIR_HOST:?set XIAO_HEI_SCENE_DIR_HOST to the extracted scene directory on the host (e.g. /path/to/unity_env_models/arabic_room)}/environment:/home/docker/autonomy_stack_mecanum_wheel_platform/src/base_autonomy/vehicle_simulator/mesh/unity/environment:ro
