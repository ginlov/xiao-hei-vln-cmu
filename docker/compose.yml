services:
  # Challenge simulator (unmodified official image).
  system:
    image: zhangjicmu/ubuntu24_ros:cmu_vla_challenge_simulation
    container_name: iros2026_system
    privileged: true
    network_mode: host
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb
    stdin_open: true
    tty: true

  # Our AI module (dummy responder, no GPU needed).
  ai_module:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        XIAO_HEI_EXTRA: ${XIAO_HEI_EXTRA:-}
    image: xiao-hei/ai_module:latest
    container_name: xiao_hei_ai_module
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - PYTHONUNBUFFERED=1
      - XIAO_HEI_RESPONDER=${XIAO_HEI_RESPONDER:-dummy}
      - XIAO_HEI_VLM_TICK_HZ
      # Gemini responder credentials (only read when XIAO_HEI_RESPONDER=gemini).
      # Build with XIAO_HEI_EXTRA=gemini to install the SDK into the image.
      - XIAO_HEI_GEMINI_API_KEY
      - XIAO_HEI_GEMINI_MODEL
      - XIAO_HEI_GEMINI_MAX_EXPLORE_TICKS
      - XIAO_HEI_VLM_LOG_DIR=${XIAO_HEI_VLM_LOG_DIR:-}
    volumes:
      - ../src:/opt/xiao_hei_vln/src:ro
      - ../vlm_logs:/vlm_logs
    stdin_open: true
    tty: true
    depends_on:
      - system
    restart: unless-stopped
