# Unified xiao-hei VLN stack.
#
# Covers the `dummy` and `perception` responders. Use the `docker/run`
# wrapper, which takes the responder as its first argument and sets both the
# compose profile and XIAO_HEI_RESPONDER for you:
#
#   docker/run dummy      up -d   # dummy responder, no sidecars
#   docker/run perception up -d   # perception sidecar (YOLO+SAM)
#
# Or call docker compose directly if you'd rather manage it yourself — but
# note the profile alone is not enough: without XIAO_HEI_RESPONDER=perception
# the sidecar starts while the node quietly stays on `dummy`.
#
#   docker compose -f docker/compose.yml up -d                          # dummy (no sidecars)
#   docker compose -f docker/compose.yml --profile perception up -d     # perception sidecar
#
# The full submission stack (frontier exploration + perception + Gemini)
# has its own file: docker/compose_scene_gemini.yml.
#
# Perception responder options (all optional):
#   export XIAO_HEI_SCENE_DIR_HOST=/abs/path/unity_env_models/arabic_room  # sim scene to load
#   export XIAO_HEI_TRAJECTORY_JSON_HOST=/abs/path/trajectory.json         # Phase-A coverage walk

# Pin the project name: Compose otherwise derives it from the parent dir
# ("docker"), which collides with every other checkout of this repo and with
# the challenge template — causing stacks to merge and clobber each other.
name: xiao-hei

services:
  # Challenge simulator (unmodified official image).
  system:
    image: zhangjicmu/ubuntu24_ros:cmu_vla_challenge_simulation
    container_name: iros2026_system
    privileged: true
    network_mode: host
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Our AI module — single image, env-driven responder choice. The image
  # always installs `perception` (the lightweight HTTP client for the
  # sidecar), so the same build serves dummy / perception.
  ai_module:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        XIAO_HEI_EXTRA: ${XIAO_HEI_EXTRA:-perception,exploration}
    image: xiao-hei/ai_module:latest
    container_name: xiao_hei_ai_module
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - PYTHONUNBUFFERED=1
      - XIAO_HEI_RESPONDER=${XIAO_HEI_RESPONDER:-dummy}
      - XIAO_HEI_OBJECT_MAP=${XIAO_HEI_OBJECT_MAP:-}
      - XIAO_HEI_PERCEPTION_MIN_INLIERS
      - XIAO_HEI_PERCEPTION_SCORE_THRESHOLD
      - XIAO_HEI_EXPLORATION_MAX_WAYPOINTS=${XIAO_HEI_EXPLORATION_MAX_WAYPOINTS:-500}
      - XIAO_HEI_EXPLORATION_STRATEGY=${XIAO_HEI_EXPLORATION_STRATEGY:-frontier}
      - XIAO_HEI_VLM_TICK_HZ
      - XIAO_HEI_VLM_LOG_DIR=${XIAO_HEI_VLM_LOG_DIR:-/vlm_logs}
      - XIAO_HEI_EXPLORATION_LOG_DIR=${XIAO_HEI_EXPLORATION_LOG_DIR:-/exploration_logs}
      # Periodic scene-graph dump for offline dataset building. Empty → off.
      - XIAO_HEI_SCENE_DUMP_PATH=${XIAO_HEI_SCENE_DUMP_PATH:-}
      # Names the per-run log dir (exploration_logs/<scene>/). Only the basename
      # is used — the path itself points at the host, not into this container.
      - XIAO_HEI_SCENE_DIR_HOST=${XIAO_HEI_SCENE_DIR_HOST:-}
      # Lets the node screenshot the sim's RViz window when exploration ends.
      # Empty on a headless host, which the node reads as "skip it".
      - DISPLAY=${DISPLAY:-}
      # Perception — used only when XIAO_HEI_RESPONDER=perception (the
      # wrapper activates --profile perception, which starts the sidecar
      # below). Ignored otherwise.
      - XIAO_HEI_PERCEPTION_BASE_URL=${XIAO_HEI_PERCEPTION_BASE_URL:-http://localhost:8001}
      # Coverage trajectory walked in Phase A. Collapses to an empty
      # string when the host var is unset (responder then answers from
      # the start pose). Used by the perception responder.
      - XIAO_HEI_TRAJECTORY_JSON=${XIAO_HEI_TRAJECTORY_JSON_HOST:+/data/trajectory.json}
      # Dev-only perception scoreboard: point at a scene's object_list.txt on
      # the host to score the live map vs GT in rviz. Empty → scoreboard off.
      - XIAO_HEI_GT_OBJECT_LIST=${XIAO_HEI_GT_OBJECT_LIST_HOST:+/data/gt_object_list.txt}
      # NOTE: no Gemini vars here. This file only runs `dummy` / `perception`,
      # neither of which calls Gemini; the submission stack that does lives in
      # docker/compose_scene_gemini.yml.
    volumes:
      - ../src:/opt/xiao_hei_vln/src:ro
      - ../vlm_logs:/vlm_logs
      - ../exploration_logs:/exploration_logs
      # X socket, so the node can reach the display RViz drew into. Needs
      # `xhost +local:` on the host, same as the sim container.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Conditional trajectory mount. When the host var is unset, the
      # mount resolves to /dev/null:/data/...:ro — harmless because the
      # responder then has no trajectory to read.
      - ${XIAO_HEI_TRAJECTORY_JSON_HOST:-/dev/null}:/data/trajectory.json:ro
      - ${XIAO_HEI_GT_OBJECT_LIST_HOST:-/dev/null}:/data/gt_object_list.txt:ro
    stdin_open: true
    tty: true
    depends_on:
      - system
    restart: unless-stopped

  # Perception sidecar — YOLOv8x-World v2 + SAM 2.1 Hiera Tiny, served over
  # HTTP on :8001. Only starts under `--profile perception`, which
  # `docker/run perception` activates for you.
  perception:
    profiles: [perception]
    build:
      context: ../perception
      dockerfile: Dockerfile
    image: xiao-hei/perception:latest
    container_name: xiao_hei_perception
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - PERCEPTION_HOST=0.0.0.0
      - PERCEPTION_PORT=8001
      # Debug mode: when truthy, every /detect dumps per-step images
      # (equirect → faces → bboxes → masks → reprojected equirect) to the
      # mounted debug dir below. Enable with `PERCEPTION_DEBUG=1` on the host.
      - PERCEPTION_DEBUG=${PERCEPTION_DEBUG:-}
    # Bind-mount the source dir in dev so editing server.py / pipeline.py
    # takes effect on container restart without rebuilding the image.
    # rw is required so the model weight cache (baked at /opt/perception/models)
    # remains accessible after the bind mount overlays the host dir; we
    # mount with delegated semantics on the source files only.
    volumes:
      - ../perception/server.py:/opt/perception/server.py:ro
      - ../perception/pipeline.py:/opt/perception/pipeline.py:ro
      - ../perception/geometry.py:/opt/perception/geometry.py:ro
      # Debug step images land here (host: perception/debug/).
      - ../perception/debug:/opt/perception/debug
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
